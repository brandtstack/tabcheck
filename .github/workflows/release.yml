name: release

# Push a v* tag to stage a release. npm trusted publishing (OIDC): no token is stored anywhere.
# The trusted publisher is allowed to STAGE only (Adrian's choice, 2026-11-05): the version goes
# live after he approves it on npmjs.com with 2FA (`npm stage list tabcheck`, then approve).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run verify
      # `npm stage` arrived in npm 11.x; the npm bundled with the runner's Node may predate it.
      - run: npm install -g npm@11.19.1
      - run: npm stage publish
